<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.groq.com; img-src 'self' data:;">
<title>Shattered Reverie ~ Ballad of the Borderless Sky</title>
<style>
@font-face{font-family:'Pixel8';src:url('fonts/PressStart2P-Regular.ttf') format('truetype');font-display:swap}
@font-face{font-family:'VT323R';src:url('fonts/VT323-Regular.ttf') format('truetype');font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;position:fixed;inset:0;overscroll-behavior:none;
 touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000}
#cv{display:block;background:#000;touch-action:none}
#hint{position:fixed;left:8px;bottom:6px;color:#7a86a8;font:15px 'VT323R',monospace;
 pointer-events:none;z-index:5;line-height:1.3}
#hint .mob{display:none}
@media (pointer:coarse),(any-pointer:coarse){
 #hint .pc{display:none}
 #hint .mob{display:inline}
 #hint{font-size:12px}
}
body.touch #hint{display:none}
#pad{position:fixed;left:0;top:0;width:100%;height:100%;display:none;z-index:8;
 pointer-events:none;font-family:'VT323R',monospace;
 --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
 --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
#pad .padControl{position:absolute;display:none;align-items:center;justify-content:center;
 text-align:center;color:#dff;background:rgba(8,16,30,.72);border:2px solid rgba(127,223,255,.75);
 border-radius:50%;box-shadow:0 0 12px rgba(80,180,255,.18);pointer-events:auto;touch-action:none;
 -webkit-user-select:none;user-select:none;line-height:1;letter-spacing:1px;overflow:hidden}
#padStick{background:rgba(8,16,30,.5);border-color:rgba(127,223,255,.55)}
#padStick.active{background:rgba(10,24,44,.78);border-color:#dff}
#padKnob{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42%;height:42%;
 border-radius:50%;background:rgba(120,200,255,.45);border:1.5px solid #dff;
 box-shadow:0 0 10px rgba(120,200,255,.5);pointer-events:none}
#padFire{border-color:#ff9fb0;color:#ffd7dd;background:rgba(40,10,20,.72)}
#padBomb{border-color:#8fd8ff;color:#dff;background:rgba(8,22,40,.72)}
#padSpell{border-color:#c8a0ff;color:#eadcff;background:rgba(24,10,40,.72)}
#padFocus{border-color:#ffd700;color:#ffe9a0;background:rgba(36,28,0,.72)}
#padFocus.on{border-color:#ffd700;background:rgba(120,90,0,.55);color:#fff}
#padPause,#padFull{border-color:#9ab;color:#dff;background:rgba(12,18,30,.72)}
#pad .off{opacity:.45}
#pad .press{filter:brightness(1.25)}
#rotate{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;
 background:rgba(2,4,10,.94);color:#dff;text-align:center;padding:24px;font-family:'VT323R',monospace}
#rotate .ico{font-size:52px;line-height:1;color:#7fdfff;margin-bottom:10px}
#rotate .big{font-size:24px;letter-spacing:2px}
#rotate small{display:block;color:#789;font-size:15px;margin-top:8px}
#rotate button{margin-top:20px;background:#0d1626;color:#dff;border:1px solid #7fdfff;
 font-family:'VT323R',monospace;font-size:16px;padding:10px 22px;touch-action:manipulation}
#rotateFull{display:none}
@media (any-pointer:coarse) and (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="640" height="480"></canvas></div>
<div id="hint"><span class="pc">Arrows move | Shift focus | Z shoot/confirm | C spell | X flash | Esc/R pause | S settings | H help | A autofire | M mute</span><span class="mob">Use the on-screen controls</span></div>
<div id="pad" aria-hidden="true">
 <div id="padStick" class="padControl"><div id="padKnob"></div></div>
 <div id="padPause" class="padControl">II</div>
 <div id="padFull" class="padControl">FULL</div>
 <div id="padFocus" class="padControl">FOCUS</div>
 <div id="padSpell" class="padControl">SPELL</div>
 <div id="padBomb" class="padControl">BOMB</div>
 <div id="padFire" class="padControl">FIRE</div>
</div>
<div id="rotate"><div class="ico">&#8635;</div><div class="big">ROTATE YOUR DEVICE</div><small>Landscape gives the biggest play area</small><button id="rotateFull">FULLSCREEN</button><button id="rotateSkip">PLAY IN PORTRAIT</button></div>
<script src="engine.js"></script>
<script src="audio.js"></script>
<script src="music.js"></script>
<script src="player.js"></script>
<script src="boss.js"></script>
<script src="story.js"></script>
<script src="render.js"></script>
<script src="patterns.js"></script>
<script src="p4.js"></script>
<script src="p5.js"></script>
<script src="p6.js"></script>
<script src="pex.js"></script>
<script src="pexa.js"></script>
<script src="main.js"></script>
<script src="boot.js"></script>
</body>
</html>
