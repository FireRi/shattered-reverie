<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.groq.com; img-src 'self' data:;">
<title>Shattered Reverie ~ Ballad of the Borderless Sky</title>
<style>
@font-face{font-family:'Pixel8';src:url('fonts/PressStart2P-Regular.ttf') format('truetype');font-display:swap}
@font-face{font-family:'VT323R';src:url('fonts/VT323-Regular.ttf') format('truetype');font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;position:fixed;inset:0;overscroll-behavior:none;
 touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#cv{display:block;background:#000;touch-action:none}
#hint{position:fixed;left:8px;bottom:6px;color:#7a86a8;font:15px 'VT323R',monospace;
 pointer-events:none;z-index:5;line-height:1.3}
#hint .mob{display:none}
@media (pointer:coarse),(any-pointer:coarse){
 #hint .pc{display:none}
 #hint .mob{display:inline}
 #hint{font-size:12px}
}
#rotate{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;
 background:rgba(2,4,10,.94);color:#dff;text-align:center;padding:24px;font-family:'VT323R',monospace}
#rotate .ico{font-size:52px;line-height:1;color:#7fdfff;margin-bottom:10px}
#rotate .big{font-size:24px;letter-spacing:2px}
#rotate small{display:block;color:#789;font-size:15px;margin-top:8px}
#rotate button{margin-top:20px;background:#0d1626;color:#dff;border:1px solid #7fdfff;
 font-family:'VT323R',monospace;font-size:16px;padding:10px 22px;touch-action:manipulation}
@media (any-pointer:coarse) and (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="640" height="480"></canvas></div>
<div id="hint"><span class="pc">Arrows move | Shift focus | Z shoot/confirm | C spell | X flash | Esc/R pause | S settings | H help | A autofire | M mute</span><span class="mob">Drag to move &bull; Auto-fire ON<br>FOCUS / SPELL / FLASH buttons &bull; II pauses</span></div>
<div id="rotate"><div class="ico">&#8635;</div><div class="big">ROTATE YOUR DEVICE</div><small>Landscape gives the best play area</small><button id="rotateSkip">PLAY IN PORTRAIT</button></div>
<script src="engine.js"></script>
<script src="audio.js"></script>
<script src="player.js"></script>
<script src="boss.js"></script>
<script src="story.js"></script>
<script src="render.js"></script>
<script src="patterns.js"></script>
<script src="p4.js"></script>
<script src="p5.js"></script>
<script src="p6.js"></script>
<script src="pex.js"></script>
<script src="pexa.js"></script>
<script src="main.js"></script>
<script src="boot.js"></script>
</body>
</html>
