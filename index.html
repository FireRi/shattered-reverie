<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.groq.com; img-src 'self' data:;">
<title>Shattered Reverie ~ Ballad of the Borderless Sky</title>
<style>
@font-face{font-family:'Pixel8';src:url('fonts/PressStart2P-Regular.ttf') format('truetype');font-display:swap}
@font-face{font-family:'VT323R';src:url('fonts/VT323-Regular.ttf') format('truetype');font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;position:fixed;inset:0;
 touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:absolute;inset:0;background:#000}
#cv{
 /* Fill as much space as possible maintaining 4:3 */
 width:min(100vw,calc(100vh*(4/3)));
 height:min(100vh,calc(100vw*(3/4)));
 /* Center on screen regardless of size */
 position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
 display:block;background:#000;touch-action:none;
}
#hint{position:fixed;left:8px;bottom:6px;color:#7a86a8;font:15px 'VT323R',monospace;
 pointer-events:none;z-index:5;line-height:1.3}
#hint .mob{display:none}
@media (pointer:coarse){
 #hint .pc{display:none}
 #hint .mob{display:inline}
 #hint{font-size:12px}
}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="640" height="480"></canvas></div>
<div id="hint">
 <span class="pc">Arrows move | Shift focus | Z shoot | C spell | X flash bomb | Graze &#8594; OVERDRIVE | Esc pause | A autofire | R retry | M mute</span>
 <span class="mob">Drag anywhere to move &bull; Auto-fire ON<br>Tap bottom edge = flash bomb / spell &bull; Tap top = skip text</span>
</div>
<script src="engine.js"></script>
<script src="audio.js"></script>
<script src="player.js"></script>
<script src="boss.js"></script>
<script src="render.js"></script>
<script src="patterns.js"></script>
<script src="p4.js"></script>
<script src="p5.js"></script>
<script src="p6.js"></script>
<script src="pex.js"></script>
<script src="pexa.js"></script>
<script src="main.js"></script>
<script>
(function(){
 var cv=document.getElementById('cv');
 var lastTouch=0;
 cv.addEventListener('touchstart',function(e){
  e.preventDefault();
  try{AudioSys.unlock();}catch(err){}
  var t=e.touches[0];
  var r=cv.getBoundingClientRect();
  var gx=(t.clientX-r.left)/r.width*640;
  var gy=(t.clientY-r.top)/r.height*480;

  /* Any touch resets demo idle timer */
  G.idleT=0;

  /* Non-play screens: tap acts as Z confirm */
  if(G.screen!=='play'&&G.screen!=='pause'){
   edge[90]=true; /* simulate Z press edge for menu system */
   return;
  }

  /* Pause screen: tap resumes */
  if(G.screen==='pause'){edge[90]=true;return;}

  /* Play screen: check zones */
  if(gy>420){
   /* Bottom strip = flash bomb (double tap) or spell (single tap) */
   var now=Date.now();
   if(now-lastTouch<300){useFlashBomb();}
   else{useSpell();}
   lastTouch=now;
   return;
  }

  /* Movement zone: start dragging */
  _tSX=gx;_tSY=gy;_tPX=PL.x;_tPY=PL.y;_tAct=true;
 },{passive:false});

 cv.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(!_tAct||G.screen!=='play')return;
  var t=e.touches[0];var r=cv.getBoundingClientRect();
  var gx=(t.clientX-r.left)/r.width*640;
  var gy=(t.clientY-r.top)/r.height*480;
  PL.x=Math.max(12,Math.min(W-12,_tPX+(gx-_tSX)*1.7));
  PL.y=Math.max(12,Math.min(H-12,_tPY+(gy-_tSY)*1.7));
 },{passive:false});

 cv.addEventListener('touchend',function(e){e.preventDefault();_tAct=false;},{passive:false});
})();
</script>
</body>
</html>
