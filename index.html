<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.groq.com; img-src 'self' data:;">
<title>Shattered Reverie ~ Ballad of the Borderless Sky</title>
<style>
@font-face{font-family:'Pixel8';src:url('fonts/PressStart2P-Regular.ttf') format('truetype');font-display:swap}
@font-face{font-family:'VT323R';src:url('fonts/VT323-Regular.ttf') format('truetype');font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#cv{display:block;background:#000;touch-action:none}
#hint{position:fixed;left:8px;bottom:6px;color:#7a86a8;font:15px 'VT323R',monospace;user-select:none;pointer-events:none}
#hint .mob{display:none}
@media (pointer:coarse){#hint .pc{display:none}#hint .mob{display:inline}}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="640" height="480"></canvas></div>
<div id="hint"><span class="pc">Arrows move | Shift focus | Z shoot | C spell | X flash bomb | Graze &#8594; OVERDRIVE | Esc pause | R retry | M mute</span><span class="mob">Drag to move | Bottom edge = bomb/spell | Auto-fire ON | Any key = exit demo</span></div>
<script src="engine.js"></script>
<script src="audio.js"></script>
<script src="player.js"></script>
<script src="boss.js"></script>
<script src="render.js"></script>
<script src="patterns.js"></script>
<script src="p4.js"></script>
<script src="p5.js"></script>
<script src="p6.js"></script>
<script src="pex.js"></script>
<script src="pexa.js"></script>
<script src="main.js"></script>
<script>
(function(){
 var cv=document.getElementById('cv');
 function fit(){
  var s=Math.min(window.innerWidth/W,window.innerHeight/H);
  cv.style.width=(W*s)+'px';
  cv.style.height=(H*s)+'px';
 }
 window.addEventListener('resize',fit,{passive:true});
 window.addEventListener('orientationchange',function(){setTimeout(fit,100)});
 fit();
})();
</script>
</body>
</html>
